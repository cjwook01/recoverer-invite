<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>리커버러 친구 초대</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: #f5f5f5; color: #1a1a1a;
    }
    .card {
      background: #fff; border-radius: 20px; padding: 40px 32px;
      max-width: 360px; width: 90%; text-align: center;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    }
    .emoji { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 15px; color: #666; margin-bottom: 28px; line-height: 1.5; }
    .btn {
      display: block; width: 100%; padding: 14px; border-radius: 12px;
      font-size: 16px; font-weight: 600; text-decoration: none; margin-bottom: 12px;
    }
    .primary { background: #1a1a1a; color: #fff; }
    .secondary { background: #f0f0f0; color: #1a1a1a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">📖</div>
    <h1>리커버러에서 친구 요청이 왔어요</h1>
    <p>함께 독서하는 습관을 만들어보세요</p>
    <a id="openApp" href="#" class="btn primary">앱에서 열기</a>
    <a href="https://play.google.com/store/apps/details?id=com.recoverer.app" class="btn secondary">앱 설치하기</a>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const userId = params.get('userId') || '';
    const deepLink = 'com.recoverer.app://invite?userId=' + encodeURIComponent(userId);
    document.getElementById('openApp').href = deepLink;
    if (userId) {
      window.location.href = deepLink;
    }
  </script>
</body>
</html>
